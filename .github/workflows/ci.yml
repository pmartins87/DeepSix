name: DeepSix CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  reference-core:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Run reference-core tests
        run: python -m unittest discover -s tests -v
